<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Map</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">

    <!-- LEFT: MAP -->
    <div id="map-container">
      <img id="map-image" src="map.jpeg" alt="map" />
    </div>

    <!-- RIGHT: INFO PANEL -->
    <div id="info-panel">
      <h2 id="info-title">Select a location</h2>

      <img id="info-image" />

      <p id="info-description">
        Click a marker to see details.
      </p>
    </div>

  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
